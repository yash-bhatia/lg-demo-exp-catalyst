<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <defs>
    <linearGradient id="soundbar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5dc"/>
      <stop offset="100%" style="stop-color:#e8e4c9"/>
    </linearGradient>
  </defs>
  <rect width="300" height="160" fill="url(#soundbar-bg)"/>
  <!-- Soundbar shape -->
  <rect x="150" y="85" width="120" height="20" rx="10" fill="#333"/>
  <circle cx="165" cy="95" r="5" fill="#555"/>
  <circle cx="255" cy="95" r="5" fill="#555"/>
  <rect x="175" y="90" width="70" height="10" rx="2" fill="#444"/>
  <!-- TV above soundbar -->
  <rect x="160" y="30" width="100" height="50" rx="2" fill="#2a2a2a"/>
  <rect x="163" y="33" width="94" height="44" fill="#3d5a80"/>
  <!-- Decorative waves -->
  <path d="M40 70 Q60 60 80 70 T120 70" stroke="rgba(0,0,0,0.1)" stroke-width="2" fill="none"/>
  <path d="M40 80 Q60 70 80 80 T120 80" stroke="rgba(0,0,0,0.08)" stroke-width="2" fill="none"/>
</svg>
