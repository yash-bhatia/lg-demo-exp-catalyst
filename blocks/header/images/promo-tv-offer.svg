  <rect x="180" y="45" width="35" height="35" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="220" y="45" width="40" height="15" fill="rgba(255,255,255,0.15)"/>
  <rect x="220" y="65" width="40" height="15" fill="rgba(255,255,255,0.1)"/>
  <!-- TV Stand -->
