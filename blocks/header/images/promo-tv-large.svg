<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <defs>
    <linearGradient id="tv-large-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="160" fill="url(#tv-large-bg)"/>
  <!-- TV Shape -->
  <rect x="180" y="35" width="90" height="55" rx="3" fill="#333" stroke="#555" stroke-width="2"/>
  <rect x="185" y="40" width="80" height="45" fill="#4a90d9"/>
  <!-- TV Stand -->
  <rect x="210" y="90" width="40" height="5" fill="#444"/>
  <rect x="200" y="95" width="60" height="3" rx="1" fill="#555"/>
  <!-- Decorative elements -->
  <circle cx="50" cy="100" r="30" fill="rgba(255,255,255,0.05)"/>
</svg>
